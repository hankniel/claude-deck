name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          # the runners' Azure mirror stalls; use the main archive with retries
          echo "http://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          A="-o Acquire::Retries=3 -o Acquire::http::Timeout=15"
          sudo DEBIAN_FRONTEND=noninteractive apt-get $A update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get $A install -y -q --no-install-recommends libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and package
        run: VERSION="${GITHUB_REF_NAME#v}" ./linux/package.sh --build
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - name: Build universal CC Deck.app
        run: UNIVERSAL=1 ./macos/build.sh
      - name: Zip
        run: cd macos/build && ditto -c -k --keepParent "CC Deck.app" CC-Deck-macos.zip
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "macos/build/CC-Deck-macos.zip\nmacos/build/CC-Deck.dmg" }
  publish:
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="${GITHUB_REF_NAME}"
          [[ "$tag" == v* ]] || tag="nightly"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "CC Deck $tag" --generate-notes
          gh release upload "$tag" dist/* -R "$GITHUB_REPOSITORY" --clobber
