name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the builds to (e.g. v0.2.0)"
        required: true
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: |
          # package downloads from the runners' default mirrors stall; use an HTTPS mirror over IPv4
          echo "https://mirrors.edge.kernel.org/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g; s|http://archive.ubuntu.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g; s|http://security.ubuntu.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g' /etc/apt/sources.list.d/*.sources /etc/apt/sources.list 2>/dev/null || true
          A="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o Acquire::ForceIPv4=true"
          sudo DEBIAN_FRONTEND=noninteractive apt-get $A update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get $A install -y -q --no-install-recommends libgtk-4-dev libadwaita-1-dev libvte-2.91-gtk4-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and package
        run: T="${{ inputs.tag || github.ref_name }}"; VERSION="${T#v}" ./linux/package.sh --build
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: dist/* }
  macos:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin" }
      - name: Build universal CC Deck.app
        run: UNIVERSAL=1 ./macos/build.sh
      - name: Zip
        run: cd macos/build && ditto -c -k --keepParent "CC Deck.app" CC-Deck-macos.zip
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: "macos/build/CC-Deck-macos.zip\nmacos/build/CC-Deck.dmg" }
  publish:
    needs: [linux, macos]
    # the Linux packages can also be uploaded by hand when the runner's apt mirrors are down
    if: ${{ !cancelled() && (needs.linux.result == 'success' || needs.macos.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Publish the release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          [[ "$tag" == v* ]] || { echo "not a release tag: $tag"; exit 1; }
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "CC Deck $tag" --generate-notes
          gh release upload "$tag" dist/* -R "$GITHUB_REPOSITORY" --clobber
